[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventttt"
version = "0.1.0"
description = "Event-level few-shot LoRA adaptation for multimodal building damage assessment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tifffile>=2024.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "einops>=0.8",
  "peft>=0.14,<0.15",
  "qwen-vl-utils>=0.0.8",
  "timm>=1.0",
  "torchvision>=0.15,<1",
  "transformers>=4.57,<5",
]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
