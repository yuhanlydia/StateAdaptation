name: Source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact checked-out commit
        run: |
          git rev-parse HEAD > /tmp/stateadaptation-source-commit.txt
          git archive --format=zip HEAD -o /tmp/stateadaptation-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stateadaptation-source
          path: |
            /tmp/stateadaptation-source.zip
            /tmp/stateadaptation-source-commit.txt
          retention-days: 7
