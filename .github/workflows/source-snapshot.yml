name: Source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/stateadaptation-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stateadaptation-source
          path: /tmp/stateadaptation-source.zip
          retention-days: 3
